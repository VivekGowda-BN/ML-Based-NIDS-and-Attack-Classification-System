# =============================================================================
#  pyproject.toml — ML-Based NIDS (Mode 1)
# =============================================================================

# ─── Build system ─────────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# ─── Project metadata ─────────────────────────────────────────────────────────
[project]
name            = "ml-nids"
version         = "0.1.0"
description     = "ML-Based Network Intrusion Detection System — Mode 1 (UNSW-NB15, offline replay)"
readme          = "README.md"
requires-python = ">=3.10"
license         = "MIT"
authors         = [{ name = "Vivek Gowda B N" }]

keywords = [
  "nids",
  "intrusion-detection",
  "machine-learning",
  "cybersecurity",
  "unsw-nb15",
  "xgboost",
  "shap",
]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

# Core runtime dependencies (mirrors requirements.txt — kept in sync manually)
dependencies = [
  "numpy>=1.26.0,<3.0",
  "pandas>=2.2.0,<3.0",
  "pyarrow>=15.0.0,<21.0",
  "scikit-learn>=1.4.0,<2.0",
  "imbalanced-learn>=0.13.0,<0.16.0",
  "joblib>=1.3.0,<2.0",
  "xgboost>=2.0.0,<3.0",
  # Prebuilt Windows wheels (including abi3/cp313) are available for SHAP >= 0.48.0.
  # Falls back to permutation importance when unavailable (see explain.py).
  "shap>=0.48.0,<1.0.0",
  "matplotlib>=3.8.0,<4.0",
  "seaborn>=0.13.0,<0.14",
  "plotly>=5.20.0,<7.0",
  "streamlit>=1.35.0,<2.0",
  "pydantic>=2.7.0,<3.0",
  "python-dotenv>=1.0.0,<2.0",
]

# Optional dependency groups
[project.optional-dependencies]
notebooks = [
  "jupyter>=1.0.0,<2.0",
  "ipykernel>=6.29.0,<7.0",
]
dev = [
  "pytest>=8.2.0,<9.0",
  "pytest-cov>=5.0.0,<7.0",
  "ruff>=0.5.0",
]

# ─── Package discovery ────────────────────────────────────────────────────────
# `src` layout: `import nids` resolves to src/nids/
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ─── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

# ─── ruff (linter + formatter) ────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nids"]

# ─── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version      = "3.10"
ignore_missing_imports = true
strict              = false
